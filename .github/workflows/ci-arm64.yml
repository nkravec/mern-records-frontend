name: arm64 runner validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: [self-hosted, arm64, fusion-mac]
    steps:
      - uses: actions/checkout@v4

      # This job runs on the fusion-mac Linux VM runner, which is provisioned with
      # node/npm but not pnpm. Install it in-job rather than relying on host state,
      # so the workflow is self-contained across both self-hosted runners.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Start preview server
        run: |
          # NOTE: pnpm forwards script args directly — do NOT use npm's `--`
          # separator, which pnpm silently swallows (Vite would then ignore
          # --host/--port and bind its default port).
          setsid pnpm run preview --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          echo $! > preview.pid

      - name: Wait for preview server and check content
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          BODY=$(curl -s http://127.0.0.1:4173/)
          echo "$BODY" | grep -q "MERN (MongoDB" || { echo "Expected title not found"; cat preview.log; exit 1; }

      - name: Teardown
        if: always()
        run: kill -- -"$(cat preview.pid)" 2>/dev/null || true
