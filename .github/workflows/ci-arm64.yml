name: arm64 runner validation

on:
  push:
    branches: [main]
  # Without this, validation only ran after merge — so a PR adding generated
  # Playwright tests was never exercised by CI before landing.
  pull_request:
  workflow_dispatch:

# This and the Testbot workflow now target the SAME single runner, so a PR runs
# them one after another rather than in parallel. Cap redundant work: superseded
# pushes to a PR cancel their in-flight validation. Pushes to main are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: [self-hosted, arm64, macos-host]
    steps:
      - uses: actions/checkout@v4

      # The macOS host does have pnpm on PATH, so this is no longer about supplying
      # a missing tool: it pins the version to the one in package.json
      # `packageManager`, independent of whatever the host happens to have installed.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Start preview server
        run: |
          # `set -m` rather than `setsid`: setsid is Linux-only and does not exist on
          # macOS. Job control gives the server its own process group just the same,
          # so teardown can kill the whole tree with `kill -- -PID`.
          set -m
          # NOTE: pnpm forwards script args directly — do NOT use npm's `--`
          # separator, which pnpm silently swallows (Vite would then ignore
          # --host/--port and bind its default port).
          pnpm run preview --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          echo $! > preview.pid

      - name: Wait for preview server and check content
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          BODY=$(curl -s http://127.0.0.1:4173/)
          echo "$BODY" | grep -q "MERN (MongoDB" || { echo "Expected title not found"; cat preview.log; exit 1; }

      # Both downloads are required: Playwright ships chromium-headless-shell
      # separately from chromium, and headless runs launch the shell — installing
      # only `chromium` fails at launch with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium chromium-headless-shell

      # Runs the UI tests Skyramp Testbot generates into tests/ (see
      # playwright.config.ts). --pass-with-no-tests keeps this green on branches
      # where no generated specs have been committed yet. The config's webServer
      # block starts the dev server on :5173, which is what the specs target.
      - name: Run generated Playwright tests
        run: pnpm exec playwright test --pass-with-no-tests

      - name: Teardown
        if: always()
        run: |
          [ -f preview.pid ] && kill -- -"$(cat preview.pid)" 2>/dev/null || true
