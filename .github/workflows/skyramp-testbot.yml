name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      mern-records-backend_ref:
        description: 'Git ref (branch, tag, or SHA) of nkravec/mern-records-backend to analyze. Defaults to its default branch.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'skyramp-testbot[bot]' }}

jobs:
  testbot:
    # Only run for pull_request events or issue_comment on PRs mentioning @skyramp-testbot
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@skyramp-testbot') && github.event.comment.user.login != 'skyramp-testbot[bot]')
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Generate GitHub App Token
        id: skyramp-testbot-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          private-key: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}
          repositories: mern-records-frontend,mern-records-backend

      # Resolve the PR head branch for every trigger. `github.head_ref` is only set on
      # pull_request events; on `@skyramp-testbot` comment re-runs (issue_comment) it is
      # empty and `github.ref_name` is the default branch, so the related-repo checkout
      # below would silently fall back to the backend's `main` (seen on run 33258877190).
      - name: Resolve PR head branch
        id: pr
        env:
          GH_TOKEN: ${{ steps.skyramp-testbot-app-token.outputs.token }}
        run: |
          if [ -n "${{ inputs['mern-records-backend_ref'] }}" ]; then
            ref="${{ inputs['mern-records-backend_ref'] }}"
          elif [ -n "${{ github.head_ref }}" ]; then
            ref="${{ github.head_ref }}"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            ref=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json headRefName -q .headRefName)
          else
            ref="${{ github.ref_name }}"
          fi
          echo "head_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Related repo ref: $ref"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: mern-records-frontend
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          persist-credentials: false

      # Try the matching branch in the backend first so a cross-repo change is analyzed
      # as one unit; fall back to the backend's default branch when there is none.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: skyramp-checkout-mern-records-backend
        continue-on-error: true
        with:
          repository: nkravec/mern-records-backend
          path: mern-records-backend
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps['skyramp-checkout-mern-records-backend'].outcome == 'failure'
        with:
          repository: nkravec/mern-records-backend
          path: mern-records-backend
          fetch-depth: 0
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          persist-credentials: false

      # The frontend is a pnpm project (package.json `packageManager`); the runner
      # image only ships npm.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: skyramp/testbot@56fac3cc7b777cd08598ed7a7586f8d9733f3507 # v0.11.11
        env:
          # Non-POM code reuse (SkyrampUtils). v0.11.11 does not forward this itself,
          # but the agent CLI passes the step environment through to the MCP server.
          # Must be the string "1"; SKYRAMP_FEATURE_POM_REUSE stays unset (no page objects here).
          SKYRAMP_FEATURE_UTILS_REUSE: "1"
          # Skip the husky/lint-staged pre-commit hook for Testbot's commit: the repo's
          # strict import-sort rules rejected the generated tests and no side PR was opened.
          HUSKY: "0"
        with:
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          githubToken: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          githubAppId: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          githubAppPrivateKey: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}
          workingDirectory: 'mern-records-frontend'
          # Read-only extra context for analysis. Tests and the report still land in this repo.
          relatedRepoPaths: |
            ./mern-records-backend

          # The reuse gates (verify, staging, report evidence) are not in @skyramp/mcp
          # `latest` (0.3.5) yet; 0.3.6-rc.1 on the `next` tag matches letsramp/mcp main.
          # Drop this pin once the next stable @skyramp/mcp release ships.
          skyrampMcpVersion: '0.3.6-rc.1'

          # All target commands run with cwd = workingDirectory
          # ($GITHUB_WORKSPACE/mern-records-frontend). Three services, all started here:
          # MongoDB (backend's docker-compose.yml), the Express API on :5050, and the
          # Vite dev server on :5173 (which proxies /record to :5050).
          targetSetupCommand: |
            set -e

            # ---- MongoDB (Docker) --------------------------------------------------
            docker compose -f "$GITHUB_WORKSPACE/mern-records-backend/docker-compose.yml" up -d --wait

            # ---- backend: nkravec/mern-records-backend, port 5050 -----------------
            # npm, not pnpm — the backend ships package-lock.json. `npm start` is
            # `node --env-file=config.env server` and config.env is gitignored.
            cd "$GITHUB_WORKSPACE/mern-records-backend"
            npm ci
            printf 'ATLAS_URI=mongodb://localhost:27017/\nPORT=5050\n' > config.env
            node seed.js
            nohup npm start > /tmp/mern-backend.log 2>&1 &

            # ---- frontend: this repo, port 5173 -----------------------------------
            cd "$GITHUB_WORKSPACE/mern-records-frontend"
            pnpm install --frozen-lockfile
            # pnpm forwards script args directly — no `--` separator (npm-style
            # `pnpm run dev -- --port` silently drops the args). Bind 0.0.0.0, not
            # 127.0.0.1: the containerised executor reaches Vite via host.docker.internal.
            nohup pnpm run dev --host 0.0.0.0 --port 5173 > /tmp/mern-frontend-dev.log 2>&1 &

          # Ordered so a failure names the broken link: backend direct (API + MongoDB),
          # frontend root (Vite), then /record through Vite's proxy (what the UI uses).
          targetReadyCheckCommand: |
            curl -sf http://127.0.0.1:5050/record > /dev/null || { echo "backend 5050 not serving /record (is MongoDB up?)"; exit 1; }
            curl -sf http://127.0.0.1:5173 > /dev/null || { echo "frontend 5173 not serving"; exit 1; }
            curl -sf http://127.0.0.1:5173/record > /dev/null || { echo "Vite proxy 5173 -> 5050 not working"; exit 1; }
          targetReadyCheckTimeout: '300'
