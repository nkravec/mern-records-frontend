# Skyramp Workspace Configuration
workspace:
  repoName: archit/mern-records-frontend
  repoUrl: https://github.com/archit/mern-records-frontend.git
metadata:
  schemaVersion: v1
  executorVersion: v1.3.38
  updatedAt: "2026-08-19T19:15:22.513Z"
services:
  - serviceName: mern-records-frontend
    language: typescript
    framework: playwright
    testDirectory: tests
    api:
      authType: none
      baseUrl: http://localhost:5173
    runtimeDetails:
      serverStartCommand: pnpm run dev --host 127.0.0.1 --port 5173
      runtime: local
  - serviceName: mern-records-backend
    repository: archit/mern-records-backend
    language: javascript
    framework: playwright
    testDirectory: tests/skyramp
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:5050/record
    runtimeDetails:
      serverStartCommand: node --env-file=config.env server
      runtime: local
